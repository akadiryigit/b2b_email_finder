[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "b2b-email-finder"
version = "0.1.0"
description = "Find public business contact data (kiosks, gas stations, ...) from OpenStreetMap and the businesses' own websites. Free, local, open source."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "dnspython>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
ui = ["streamlit>=1.40", "pydeck>=0.9", "pandas>=2.1", "openpyxl>=3.1"]
sources = ["overturemaps>=0.10", "duckdb>=1.1"]

[project.scripts]
b2b-email-finder = "b2b_email_finder.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/b2b_email_finder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
